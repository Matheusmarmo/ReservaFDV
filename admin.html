<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FDV — Administração</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --navy:#0e1a38;--navy2:#162040;
      --blue:#1a6fc4;--sky:#4eaee8;--sky-lt:#e8f4fc;
      --white:#ffffff;--off:#f4f6fa;--border:#dce3ef;
      --text:#1a2340;--muted:#6b7a99;--danger:#d93a3a;--success:#1a9e5c;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Open Sans',sans-serif;background:var(--off);color:var(--text);min-height:100vh;}
    .topbar{background:var(--navy);height:7px;}

    /* ── Header ── */
    header{background:var(--navy);padding:0 40px;display:flex;align-items:center;height:68px;gap:12px;}
    .header-title{font-family:'Montserrat',sans-serif;font-size:14px;font-weight:600;color:rgba(255,255,255,0.9);letter-spacing:.04em;text-transform:uppercase;flex:1;}
    .header-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
    .header-user{font-size:12px;color:rgba(255,255,255,0.6);}
    .btn-header{background:transparent;border:1px solid rgba(255,255,255,0.25);color:rgba(255,255,255,0.7);border-radius:5px;padding:5px 12px;font-size:11px;font-family:'Montserrat',sans-serif;font-weight:600;cursor:pointer;letter-spacing:.04em;text-transform:uppercase;transition:all .2s;white-space:nowrap;}
    .btn-header:hover{border-color:rgba(255,255,255,0.6);color:#fff;}

    /* ── Nav ── */
    .nav-strip{background:var(--navy2);border-bottom:3px solid var(--blue);padding:0 40px;display:flex;align-items:center;height:42px;gap:4px;overflow-x:auto;}
    .nav-strip a{font-family:'Montserrat',sans-serif;font-size:11px;font-weight:600;color:rgba(255,255,255,0.6);text-decoration:none;letter-spacing:.06em;text-transform:uppercase;padding:0 14px;height:100%;display:flex;align-items:center;border-bottom:3px solid transparent;margin-bottom:-3px;transition:color .2s,border-color .2s;white-space:nowrap;}
    .nav-strip a:hover{color:#fff;}
    .nav-strip a.active{color:#fff;border-bottom-color:var(--sky);}

    /* ── Page ── */
    .page{padding:32px 40px;display:flex;flex-direction:column;gap:24px;}
    .page-title{font-family:'Montserrat',sans-serif;font-size:20px;font-weight:800;color:var(--navy);text-transform:uppercase;letter-spacing:.03em;display:flex;align-items:center;gap:8px;}
    .page-title::before{content:'';display:inline-block;width:4px;height:22px;background:var(--sky);border-radius:2px;}

    /* ── Tabs ── */
    .tabs{display:flex;gap:4px;border-bottom:2px solid var(--border);overflow-x:auto;}
    .tab{font-family:'Montserrat',sans-serif;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:10px 20px;cursor:pointer;border:none;background:transparent;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;transition:all .2s;white-space:nowrap;}
    .tab:hover{color:var(--navy);}
    .tab.active{color:var(--blue);border-bottom-color:var(--blue);}
    .tab-content{display:none;}
    .tab-content.active{display:block;}

    /* ── Card ── */
    .card{background:var(--white);border:1px solid var(--border);border-radius:10px;padding:24px;}
    .card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px;}
    .card-title{font-family:'Montserrat',sans-serif;font-size:14px;font-weight:800;color:var(--navy);text-transform:uppercase;letter-spacing:.04em;}
    .card-filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}

    /* ── Tabelas ── */
    .table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
    table{width:100%;border-collapse:collapse;min-width:500px;}
    th{font-family:'Montserrat',sans-serif;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:10px 14px;text-align:left;border-bottom:2px solid var(--border);background:var(--off);white-space:nowrap;}
    td{padding:12px 14px;font-size:13px;border-bottom:1px solid var(--border);vertical-align:middle;}
    tr:last-child td{border-bottom:none;}
    tr:hover td{background:var(--sky-lt);}

    /* ── Badges ── */
    .badge{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:20px;font-family:'Montserrat',sans-serif;white-space:nowrap;}
    .badge-admin{background:#fff3e0;color:#e65100;}
    .badge-gerenciador{background:#e8f0fc;color:#1a4fc4;}
    .badge-visualizador{background:#f0f0f0;color:#666;}
    .badge-sala{background:#e8f0fc;color:#1a4fc4;}
    .badge-auditorio{background:#f0e8fc;color:#7a1ac4;}
    .badge-lab{background:#e8fcf0;color:#1a9e5c;}
    .badge-ativo{background:#e8fcf0;color:#1a9e5c;}
    .badge-inativo{background:#fdf0f0;color:#d93a3a;}
    .badge-criou{background:#e8fcf0;color:#1a9e5c;}
    .badge-removeu{background:#fdf0f0;color:#d93a3a;}
    .badge-editou{background:#e8f0fc;color:#1a4fc4;}
    .badge-alterou{background:#fff3e0;color:#e65100;}
    .log-acao{font-family:'Montserrat',sans-serif;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:20px;white-space:nowrap;}

    /* ── Botões ── */
    .btn{font-family:'Montserrat',sans-serif;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:5px;padding:6px 12px;cursor:pointer;transition:all .2s;white-space:nowrap;}
    .btn-primary{background:var(--blue);color:#fff;border:none;}
    .btn-primary:hover{background:#1560aa;}
    .btn-edit{background:var(--sky-lt);color:var(--blue);border:1px solid #b8d8f0;}
    .btn-edit:hover{background:var(--blue);color:#fff;}
    .btn-del{background:#fdf0f0;color:var(--danger);border:1px solid #f5c0c0;}
    .btn-del:hover{background:var(--danger);color:#fff;}
    .actions{display:flex;gap:6px;flex-wrap:wrap;}
    .empty-row td{text-align:center;padding:40px;color:var(--muted);font-size:13px;}

    /* ── Modais ── */
    .modal-overlay{position:fixed;inset:0;background:rgba(14,26,56,0.5);display:none;align-items:center;justify-content:center;z-index:1000;padding:16px;}
    .modal-overlay.open{display:flex;}
    .modal{background:var(--white);border-radius:10px;padding:28px;width:100%;max-width:460px;box-shadow:0 8px 40px rgba(0,0,0,0.2);max-height:90vh;overflow-y:auto;}
    .modal-title{font-family:'Montserrat',sans-serif;font-size:16px;font-weight:800;color:var(--navy);text-transform:uppercase;letter-spacing:.04em;margin-bottom:20px;display:flex;align-items:center;gap:8px;}
    .modal-title::before{content:'';display:inline-block;width:4px;height:18px;background:var(--sky);border-radius:2px;}
    .form-group{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;}
    label{font-size:12px;font-weight:600;color:var(--muted);font-family:'Montserrat',sans-serif;letter-spacing:.02em;}
    input,select{background:var(--off);border:1.5px solid var(--border);border-radius:6px;color:var(--text);font-family:'Open Sans',sans-serif;font-size:13px;padding:9px 12px;width:100%;outline:none;transition:border-color .2s,box-shadow .2s;}
    input:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(26,111,196,0.12);background:#fff;}
    .modal-footer{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap;}
    .btn-cancel{background:var(--off);color:var(--muted);border:1px solid var(--border);font-family:'Montserrat',sans-serif;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:5px;padding:9px 18px;cursor:pointer;flex:1;}
    .btn-cancel:hover{background:var(--border);}
    .btn-save{background:var(--blue);color:#fff;border:none;font-family:'Montserrat',sans-serif;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:5px;padding:9px 18px;cursor:pointer;flex:1;}
    .btn-save:hover{background:#1560aa;}
    .error-msg{background:#fdf0f0;border:1px solid #f5c0c0;border-radius:6px;color:var(--danger);font-size:12px;padding:10px 12px;margin-top:8px;display:none;}
    .error-msg.show{display:block;}

    /* ── Filtros ── */
    select.filter-sm{width:auto;padding:6px 10px;font-size:12px;min-width:120px;}
    input.filter-sm{width:160px;padding:6px 10px;font-size:12px;}

    /* ── Toast ── */
    .toast{position:fixed;bottom:28px;right:28px;background:var(--navy);color:#fff;border-radius:8px;padding:12px 20px;font-size:13px;display:flex;align-items:center;gap:10px;box-shadow:0 4px 20px rgba(0,0,0,0.2);opacity:0;transform:translateY(10px);transition:opacity .3s,transform .3s;pointer-events:none;max-width:calc(100vw - 32px);z-index:9999;}
    .toast.show{opacity:1;transform:translateY(0);}
    .toast.success .ti{color:var(--success);}
    .toast.error .ti{color:var(--danger);}

    /* ══════════════════════════════════════════
       RESPONSIVO — MOBILE (≤ 768px)
    ══════════════════════════════════════════ */
    @media (max-width: 768px) {
      header{padding:0 16px;height:60px;}
      .header-title{font-size:12px;}
      .header-user{display:none;}
      .btn-header{padding:5px 8px;font-size:10px;}
      .nav-strip{padding:0 16px;}
      .page{padding:16px;gap:16px;}
      .page-title{font-size:16px;}
      .card{padding:16px;}
      .card-header{flex-direction:column;align-items:flex-start;}
      .card-filters{width:100%;}
      .card-filters input.filter-sm{width:100%;}
      .card-filters select.filter-sm{width:100%;}
      .tab{padding:10px 14px;font-size:11px;}
      .toast{bottom:16px;right:16px;left:16px;max-width:unset;}
      .modal-footer .btn-cancel,
      .modal-footer .btn-save{text-align:center;}
    }

    @media (max-width: 480px) {
      .header-title{font-size:11px;}
      .btn-header span{display:none;}
    }
  </style>
</head>
<body>
  <div class="topbar"></div>
  <header>
    <span class="header-title">FDV — Administração</span>
    <div class="header-right">
      <span class="header-user" id="header-user"></span>
      <button class="btn-header" onclick="abrirAlterarSenha()">🔑 <span>Alterar Senha</span></button>
      <button class="btn-header" onclick="logout()">Sair</button>
    </div>
  </header>
  <div class="nav-strip">
    <a href="reservas.html">Reservas</a>
    <a href="admin.html" class="active">Administração</a>
  </div>

  <div class="page">
    <div class="page-title">Painel do Administrador</div>

    <div class="tabs">
      <button class="tab active" onclick="switchTab('usuarios')">Usuários</button>
      <button class="tab" onclick="switchTab('locais')">Locais</button>
      <button class="tab" onclick="switchTab('logs')">Log de Atividades</button>
    </div>

    <!-- ABA: USUÁRIOS -->
    <div class="tab-content active" id="tab-usuarios">
      <div class="card">
        <div class="card-header">
          <span class="card-title">Usuários do Sistema</span>
          <button class="btn btn-primary" onclick="abrirModalUsuario()">+ Novo Usuário</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>Nome</th><th>E-mail</th><th>Perfil</th><th>Status</th><th>Ações</th></tr>
            </thead>
            <tbody id="tbody-usuarios">
              <tr class="empty-row"><td colspan="5">Carregando...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- ABA: LOCAIS -->
    <div class="tab-content" id="tab-locais">
      <div class="card">
        <div class="card-header">
          <span class="card-title">Locais e Espaços</span>
          <button class="btn btn-primary" onclick="abrirModalLocal()">+ Novo Local</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>Nome</th><th>Tipo</th><th>Status</th><th>Ações</th></tr>
            </thead>
            <tbody id="tbody-locais">
              <tr class="empty-row"><td colspan="4">Carregando...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- ABA: LOGS -->
    <div class="tab-content" id="tab-logs">
      <div class="card">
        <div class="card-header">
          <span class="card-title">Log de Atividades</span>
          <div class="card-filters">
            <input type="date" id="log-filter-date" class="filter-sm" autocomplete="off" oninput="renderLogs()">
            <select id="log-filter-acao" class="filter-sm" onchange="renderLogs()">
              <option value="">Todas as ações</option>
              <option value="CRIOU">Criações</option>
              <option value="REMOVEU">Remoções</option>
              <option value="EDITOU">Edições</option>
              <option value="ALTEROU">Alterações</option>
            </select>
            <input type="text" id="log-filter-text" class="filter-sm" placeholder="Buscar usuário..." autocomplete="off" oninput="renderLogs()">
            <button class="btn btn-primary" onclick="carregarLogs()">↻ Atualizar</button>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>Data/Hora</th><th>Usuário</th><th>Ação</th><th>Detalhe</th></tr>
            </thead>
            <tbody id="tbody-logs">
              <tr class="empty-row"><td colspan="4">Carregando...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL: USUÁRIO -->
  <div class="modal-overlay" id="modal-usuario">
    <div class="modal">
      <div class="modal-title" id="modal-usuario-title">Novo Usuário</div>
      <div class="form-group">
        <label>Nome completo</label>
        <input type="text" id="u-nome" placeholder="Nome do usuário" autocomplete="off">
      </div>
      <div class="form-group">
        <label>E-mail</label>
        <input type="email" id="u-email" placeholder="email@fdv.br" autocomplete="off">
      </div>
      <div class="form-group" id="u-senha-group">
        <label>Senha inicial</label>
        <input type="password" id="u-senha" placeholder="Mínimo 6 caracteres" autocomplete="new-password">
      </div>
      <div class="form-group">
        <label>Perfil</label>
        <select id="u-perfil">
          <option value="visualizador">Visualizador</option>
          <option value="gerenciador">Gerenciador</option>
          <option value="admin">Administrador</option>
        </select>
      </div>
      <div class="form-group" id="u-ativo-group" style="display:none">
        <label>Status</label>
        <select id="u-ativo">
          <option value="true">Ativo</option>
          <option value="false">Inativo</option>
        </select>
      </div>
      <div class="modal-footer">
        <button class="btn-cancel" onclick="fecharModal('modal-usuario')">Cancelar</button>
        <button class="btn-save" onclick="salvarUsuario()">Salvar</button>
      </div>
    </div>
  </div>

  <!-- MODAL: LOCAL -->
  <div class="modal-overlay" id="modal-local">
    <div class="modal">
      <div class="modal-title" id="modal-local-title">Novo Local</div>
      <div class="form-group">
        <label>Nome do espaço</label>
        <input type="text" id="l-nome" placeholder="Ex: Sala 101" autocomplete="off">
      </div>
      <div class="form-group">
        <label>Tipo</label>
        <select id="l-tipo">
          <option value="sala">Sala de Aula</option>
          <option value="auditorio">Auditório</option>
          <option value="lab">Laboratório</option>
        </select>
      </div>
      <div class="form-group" id="l-ativo-group" style="display:none">
        <label>Status</label>
        <select id="l-ativo">
          <option value="true">Ativo</option>
          <option value="false">Inativo</option>
        </select>
      </div>
      <div class="modal-footer">
        <button class="btn-cancel" onclick="fecharModal('modal-local')">Cancelar</button>
        <button class="btn-save" onclick="salvarLocal()">Salvar</button>
      </div>
    </div>
  </div>

  <!-- MODAL: ALTERAR SENHA -->
  <div class="modal-overlay" id="modal-senha">
    <div class="modal">
      <div class="modal-title">Alterar Senha</div>
      <div class="form-group">
        <label>Nova Senha</label>
        <input type="password" id="nova-senha" placeholder="Mínimo 6 caracteres" autocomplete="new-password">
      </div>
      <div class="form-group">
        <label>Confirmar Nova Senha</label>
        <input type="password" id="confirmar-senha" placeholder="Repita a nova senha" autocomplete="new-password">
      </div>
      <div class="error-msg" id="senha-erro"></div>
      <div class="modal-footer">
        <button class="btn-cancel" onclick="fecharModal('modal-senha')">Cancelar</button>
        <button class="btn-save" onclick="salvarSenha()">Salvar</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">
    <span class="ti" id="ti">✓</span>
    <span id="tm"></span>
  </div>

  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script>
    let editandoUsuarioId = null;
    let editandoLocalId   = null;
    let perfilAtual       = null;
    let todosLogs         = [];

    window.addEventListener('load', async () => {
      perfilAtual = await protegerPagina(['admin']);
      if (!perfilAtual) return;
      document.getElementById('header-user').textContent = perfilAtual.nome;
      await carregarUsuarios();
      await carregarLocais();
      document.querySelectorAll('.modal-overlay').forEach(o => {
        o.addEventListener('click', e => { if (e.target === o) o.classList.remove('open'); });
      });
    });

    async function registrarLog(acao, detalhe, tabela = 'sistema') {
      try {
        await db.from('logs').insert([{ usuario_id: perfilAtual?.id, usuario_nome: perfilAtual?.nome, acao, detalhe, tabela }]);
      } catch(e) { console.warn('Log falhou:', e); }
    }

    async function carregarLogs() {
      const { data, error } = await db.from('logs').select('*').order('created_at', { ascending: false }).limit(500);
      const tbody = document.getElementById('tbody-logs');
      if (error || !data?.length) { tbody.innerHTML = '<tr class="empty-row"><td colspan="4">Nenhuma atividade registrada.</td></tr>'; return; }
      todosLogs = data;
      renderLogs();
    }

    function renderLogs() {
      const fDate = document.getElementById('log-filter-date').value;
      const fAcao = document.getElementById('log-filter-acao').value.toUpperCase();
      const fText = document.getElementById('log-filter-text').value.toLowerCase();
      let list = [...todosLogs];
      if (fDate) list = list.filter(l => l.created_at.startsWith(fDate));
      if (fAcao) list = list.filter(l => l.acao.toUpperCase().includes(fAcao));
      if (fText) list = list.filter(l => (l.usuario_nome||'').toLowerCase().includes(fText));
      const tbody = document.getElementById('tbody-logs');
      if (!list.length) { tbody.innerHTML = '<tr class="empty-row"><td colspan="4">Nenhum registro encontrado.</td></tr>'; return; }
      tbody.innerHTML = list.map(l => {
        const dt = new Date(l.created_at).toLocaleString('pt-BR');
        const acao = l.acao.toUpperCase();
        let cls = 'badge-visualizador';
        if (acao.includes('CRIOU'))   cls = 'badge-criou';
        if (acao.includes('REMOVEU')) cls = 'badge-removeu';
        if (acao.includes('EDITOU'))  cls = 'badge-editou';
        if (acao.includes('ALTEROU')) cls = 'badge-alterou';
        return `<tr>
          <td style="white-space:nowrap;color:var(--muted);font-size:12px">${dt}</td>
          <td><strong>${l.usuario_nome||'—'}</strong></td>
          <td><span class="log-acao ${cls}">${l.acao}</span></td>
          <td style="font-size:12px;color:var(--muted)">${l.detalhe||'—'}</td>
        </tr>`;
      }).join('');
    }

    function switchTab(tab) {
      const names = ['usuarios','locais','logs'];
      document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', names[i] === tab));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      document.getElementById('tab-' + tab).classList.add('active');
      if (tab === 'logs') carregarLogs();
    }

    async function carregarUsuarios() {
      const { data, error } = await db.from('profiles').select('*').order('nome');
      const tbody = document.getElementById('tbody-usuarios');
      if (error || !data?.length) { tbody.innerHTML = '<tr class="empty-row"><td colspan="5">Nenhum usuário encontrado.</td></tr>'; return; }
      tbody.innerHTML = data.map(u => `
        <tr>
          <td><strong>${u.nome}</strong></td>
          <td style="font-size:12px">${u.email}</td>
          <td><span class="badge badge-${u.perfil}">${u.perfil}</span></td>
          <td><span class="badge ${u.ativo ? 'badge-ativo':'badge-inativo'}">${u.ativo?'Ativo':'Inativo'}</span></td>
          <td><div class="actions">
            <button class="btn btn-edit" onclick="abrirModalUsuario('${u.id}','${u.nome}','${u.email}','${u.perfil}',${u.ativo})">Editar</button>
            <button class="btn btn-del"  onclick="excluirUsuario('${u.id}','${u.nome}')">Excluir</button>
          </div></td>
        </tr>`).join('');
    }

    function abrirModalUsuario(id, nome, email, perfil, ativo) {
      editandoUsuarioId = id || null;
      const isNovo = !id;
      document.getElementById('modal-usuario-title').textContent = isNovo ? 'Novo Usuário' : 'Editar Usuário';
      document.getElementById('u-nome').value   = nome  || '';
      document.getElementById('u-email').value  = email || '';
      document.getElementById('u-senha').value  = '';
      document.getElementById('u-perfil').value = perfil || 'visualizador';
      document.getElementById('u-senha-group').style.display = isNovo ? 'flex' : 'none';
      document.getElementById('u-ativo-group').style.display = isNovo ? 'none' : 'flex';
      if (!isNovo) document.getElementById('u-ativo').value = String(ativo);
      document.getElementById('modal-usuario').classList.add('open');
    }

    async function salvarUsuario() {
      const nome   = document.getElementById('u-nome').value.trim();
      const email  = document.getElementById('u-email').value.trim();
      const senha  = document.getElementById('u-senha').value;
      const perfil = document.getElementById('u-perfil').value;
      const ativo  = document.getElementById('u-ativo').value === 'true';
      if (!nome || !email) { showToast('Preencha nome e e-mail.', 'error'); return; }
      const dbUser = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
        auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false }
      });
      if (!editandoUsuarioId) {
        if (!senha || senha.length < 6) { showToast('Senha deve ter ao menos 6 caracteres.', 'error'); return; }
        const { error } = await dbUser.auth.signUp({ email, password: senha, options: { data: { nome, perfil } } });
        if (error) { showToast('Erro: ' + error.message, 'error'); return; }
        await registrarLog('CRIOU USUÁRIO', `${nome} (${email}) — ${perfil}`);
      } else {
        const { error } = await db.from('profiles').update({ nome, perfil, ativo }).eq('id', editandoUsuarioId);
        if (error) { showToast('Erro ao atualizar usuário.', 'error'); return; }
        await registrarLog('EDITOU USUÁRIO', `${nome} — ${perfil}, ativo: ${ativo}`);
      }
      fecharModal('modal-usuario');
      await carregarUsuarios();
      showToast(editandoUsuarioId ? 'Usuário atualizado!' : 'Usuário criado!', 'success');
    }

    async function excluirUsuario(id, nome) {
      if (!confirm(`Excluir o usuário "${nome}"?`)) return;
      const { error } = await db.from('profiles').delete().eq('id', id);
      if (error) { showToast('Erro ao excluir usuário.', 'error'); return; }
      await registrarLog('REMOVEU USUÁRIO', nome);
      await carregarUsuarios();
      showToast('Usuário excluído.', 'success');
    }

    async function carregarLocais() {
      const { data, error } = await db.from('locais').select('*').order('tipo').order('nome');
      const tbody = document.getElementById('tbody-locais');
      if (error || !data?.length) { tbody.innerHTML = '<tr class="empty-row"><td colspan="4">Nenhum local encontrado.</td></tr>'; return; }
      const tipos = { sala: 'Sala', auditorio: 'Auditório', lab: 'Laboratório' };
      tbody.innerHTML = data.map(l => `
        <tr>
          <td><strong>${l.nome}</strong></td>
          <td><span class="badge badge-${l.tipo}">${tipos[l.tipo]||l.tipo}</span></td>
          <td><span class="badge ${l.ativo?'badge-ativo':'badge-inativo'}">${l.ativo?'Ativo':'Inativo'}</span></td>
          <td><div class="actions">
            <button class="btn btn-edit" onclick="abrirModalLocal(${l.id},'${l.nome}','${l.tipo}',${l.ativo})">Editar</button>
            <button class="btn btn-del"  onclick="excluirLocal(${l.id},'${l.nome}')">Excluir</button>
          </div></td>
        </tr>`).join('');
    }

    function abrirModalLocal(id, nome, tipo, ativo) {
      editandoLocalId = id || null;
      const isNovo = !id;
      document.getElementById('modal-local-title').textContent = isNovo ? 'Novo Local' : 'Editar Local';
      document.getElementById('l-nome').value = nome || '';
      document.getElementById('l-tipo').value = tipo || 'sala';
      document.getElementById('l-ativo-group').style.display = isNovo ? 'none' : 'flex';
      if (!isNovo) document.getElementById('l-ativo').value = String(ativo);
      document.getElementById('modal-local').classList.add('open');
    }

    async function salvarLocal() {
      const nome = document.getElementById('l-nome').value.trim();
      const tipo = document.getElementById('l-tipo').value;
      const ativo = document.getElementById('l-ativo').value === 'true';
      if (!nome) { showToast('Informe o nome do local.', 'error'); return; }
      if (!editandoLocalId) {
        const { error } = await db.from('locais').insert([{ nome, tipo }]);
        if (error) { showToast('Erro ao criar local.', 'error'); return; }
        await registrarLog('CRIOU LOCAL', `${nome} (${tipo})`);
      } else {
        const { error } = await db.from('locais').update({ nome, tipo, ativo }).eq('id', editandoLocalId);
        if (error) { showToast('Erro ao atualizar local.', 'error'); return; }
        await registrarLog('EDITOU LOCAL', `${nome} — ativo: ${ativo}`);
      }
      fecharModal('modal-local');
      await carregarLocais();
      showToast(editandoLocalId ? 'Local atualizado!' : 'Local criado!', 'success');
    }

    async function excluirLocal(id, nome) {
      if (!confirm(`Excluir o local "${nome}"?`)) return;
      const { error } = await db.from('locais').delete().eq('id', id);
      if (error) { showToast('Erro ao excluir local.', 'error'); return; }
      await registrarLog('REMOVEU LOCAL', nome);
      await carregarLocais();
      showToast('Local excluído.', 'success');
    }

    function abrirAlterarSenha() {
      document.getElementById('nova-senha').value      = '';
      document.getElementById('confirmar-senha').value = '';
      document.getElementById('senha-erro').classList.remove('show');
      document.getElementById('modal-senha').classList.add('open');
    }

    async function salvarSenha() {
      const nova      = document.getElementById('nova-senha').value;
      const confirmar = document.getElementById('confirmar-senha').value;
      const erro      = document.getElementById('senha-erro');
      erro.classList.remove('show');
      if (!nova || nova.length < 6) { erro.textContent = 'Mínimo 6 caracteres.'; erro.classList.add('show'); return; }
      if (nova !== confirmar) { erro.textContent = 'As senhas não coincidem.'; erro.classList.add('show'); return; }
      const { error } = await db.auth.updateUser({ password: nova });
      if (error) { erro.textContent = 'Erro ao alterar senha.'; erro.classList.add('show'); return; }
      await registrarLog('ALTEROU SENHA', 'Admin alterou a própria senha', 'auth');
      fecharModal('modal-senha');
      showToast('Senha alterada com sucesso!', 'success');
    }

    function fecharModal(id) { document.getElementById(id).classList.remove('open'); }

    let _tt = null;
    function showToast(msg, type = 'success', duration = 3500) {
      const t = document.getElementById('toast');
      if (_tt) clearTimeout(_tt);
      t.className = `toast show ${type}`;
      document.getElementById('ti').textContent = type === 'success' ? '✓' : '✕';
      document.getElementById('tm').textContent = msg;
      _tt = setTimeout(() => { t.className = 'toast'; }, duration);
    }
  </script>
</body>
</html>
