<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FDV — Reservas de Espaços</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --navy: #0e1a38; --navy2: #162040; --navy3: #1e2d55;
      --blue: #1a6fc4; --sky: #4eaee8; --sky-lt: #e8f4fc;
      --white: #ffffff; --off: #f4f6fa; --border: #dce3ef;
      --text: #1a2340; --muted: #6b7a99;
      --danger: #d93a3a; --success: #1a9e5c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Open Sans', sans-serif; background: var(--off); color: var(--text); min-height: 100vh; }
    .topbar { background: var(--navy); height: 7px; }
    header {
      background: var(--navy); padding: 0 40px;
      display: flex; align-items: center; height: 68px;
    }
    .header-title {
      font-family: 'Montserrat', sans-serif; font-size: 14px; font-weight: 600;
      color: rgba(255,255,255,0.9); letter-spacing: 0.04em; text-transform: uppercase;
    }
    .header-right { margin-left: auto; display: flex; align-items: center; gap: 16px; }
    .header-user { font-size: 12px; color: rgba(255,255,255,0.6); font-family: 'Open Sans', sans-serif; }
    .btn-logout {
      background: transparent; border: 1px solid rgba(255,255,255,0.25);
      color: rgba(255,255,255,0.7); border-radius: 5px; padding: 5px 12px;
      font-size: 11px; font-family: 'Montserrat', sans-serif; font-weight: 600;
      cursor: pointer; letter-spacing: 0.04em; text-transform: uppercase; transition: all 0.2s;
    }
    .btn-logout:hover { border-color: rgba(255,255,255,0.6); color: #fff; }
    .nav-strip {
      background: var(--navy2); border-bottom: 3px solid var(--blue);
      padding: 0 40px; display: flex; align-items: center; height: 42px; gap: 4px;
    }
    .nav-strip a {
      font-family: 'Montserrat', sans-serif; font-size: 11px; font-weight: 600;
      color: rgba(255,255,255,0.6); text-decoration: none; letter-spacing: 0.06em;
      text-transform: uppercase; padding: 0 14px; height: 100%;
      display: flex; align-items: center; border-bottom: 3px solid transparent;
      margin-bottom: -3px; transition: color 0.2s, border-color 0.2s;
    }
    .nav-strip a:hover { color: #fff; }
    .nav-strip a.active { color: #fff; border-bottom-color: var(--sky); }
    .main-layout { display: grid; grid-template-columns: 360px 1fr; min-height: calc(100vh - 120px); }
    .sidebar {
      background: var(--white); border-right: 1px solid var(--border);
      padding: 28px 24px; display: flex; flex-direction: column; gap: 22px;
    }
    .sidebar-heading {
      font-family: 'Montserrat', sans-serif; font-size: 16px; font-weight: 800;
      color: var(--navy); text-transform: uppercase; letter-spacing: 0.04em;
      padding-bottom: 14px; border-bottom: 2px solid var(--blue);
      display: flex; align-items: center; gap: 8px;
    }
    .sidebar-heading::before {
      content: ''; display: inline-block; width: 4px; height: 18px;
      background: var(--sky); border-radius: 2px;
    }
    .section-label {
      font-family: 'Montserrat', sans-serif; font-size: 10px; font-weight: 700;
      letter-spacing: 0.14em; text-transform: uppercase; color: var(--blue); margin-bottom: 10px;
    }
    .form-group { display: flex; flex-direction: column; gap: 5px; }
    label {
      font-size: 12px; font-weight: 600; color: var(--muted);
      font-family: 'Montserrat', sans-serif; letter-spacing: 0.02em;
    }
    select, input, textarea {
      background: var(--off); border: 1.5px solid var(--border); border-radius: 6px;
      color: var(--text); font-family: 'Open Sans', sans-serif; font-size: 13px;
      padding: 9px 12px; width: 100%; outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    select:focus, input:focus, textarea:focus {
      border-color: var(--blue); box-shadow: 0 0 0 3px rgba(26,111,196,0.12); background: #fff;
    }
    textarea { resize: vertical; min-height: 72px; }
    .time-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .btn-primary {
      background: var(--blue); color: #fff; border: none; border-radius: 6px;
      font-family: 'Montserrat', sans-serif; font-size: 13px; font-weight: 700;
      padding: 11px; cursor: pointer; width: 100%; transition: background 0.2s, transform 0.1s;
      letter-spacing: 0.04em; text-transform: uppercase;
    }
    .btn-primary:hover { background: #1560aa; }
    .btn-primary:active { transform: scale(0.98); }
    .content-area { padding: 28px 32px; display: flex; flex-direction: column; gap: 20px; }
    .content-header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
    .content-title {
      font-family: 'Montserrat', sans-serif; font-size: 18px; font-weight: 800;
      color: var(--navy); text-transform: uppercase; letter-spacing: 0.03em;
      display: flex; align-items: center; gap: 8px;
    }
    .content-title::before {
      content: ''; display: inline-block; width: 4px; height: 20px;
      background: var(--sky); border-radius: 2px;
    }
    .count-badge {
      background: var(--sky-lt); color: var(--blue); border-radius: 20px;
      padding: 3px 10px; font-size: 11px; font-weight: 700; font-family: 'Montserrat', sans-serif;
    }
    .filters {
      background: var(--white); border: 1px solid var(--border); border-radius: 8px;
      padding: 14px 18px; display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end;
    }
    .filters .form-group { flex: 1; min-width: 140px; }
    .reservations-wrap {
      background: var(--white); border: 1px solid var(--border); border-radius: 8px; overflow: hidden;
    }
    .res-table { width: 100%; border-collapse: collapse; }
    .res-table th {
      font-family: 'Montserrat', sans-serif; font-size: 10px; font-weight: 700;
      letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted);
      padding: 10px 14px; text-align: left; border-bottom: 2px solid var(--border);
      background: var(--off); white-space: nowrap;
    }
    .res-table td {
      padding: 11px 14px; font-size: 13px;
      border-bottom: 1px solid var(--border); vertical-align: middle;
    }
    .res-table tr:last-child td { border-bottom: none; }
    .res-table tbody tr:hover td { background: var(--sky-lt); }
    .type-badge {
      font-size: 9px; font-weight: 700; letter-spacing: 0.08em;
      text-transform: uppercase; padding: 2px 7px; border-radius: 20px;
    }
    .type-sala     { background: #e8f0fc; color: #1a4fc4; }
    .type-auditorio{ background: #f0e8fc; color: #7a1ac4; }
    .type-lab      { background: #e8fcf0; color: #1a9e5c; }
    .time-badge {
      display: inline-flex; align-items: center; gap: 4px;
      background: var(--sky-lt); color: var(--blue);
      border-radius: 4px; padding: 3px 8px; font-size: 11px; font-weight: 600;
    }
    .btn-details {
      background: var(--sky-lt); border: 1px solid #b8d8f0; color: var(--blue);
      border-radius: 5px; padding: 5px 10px; font-size: 11px;
      font-family: 'Montserrat', sans-serif; font-weight: 700;
      cursor: pointer; letter-spacing: 0.04em; text-transform: uppercase; transition: all 0.2s;
    }
    .btn-details:hover { background: var(--blue); color: #fff; border-color: var(--blue); }
    .btn-del {
      background: #fdf0f0; border: 1px solid #f5c0c0; color: var(--danger);
      border-radius: 5px; padding: 5px 10px; font-size: 11px;
      font-family: 'Montserrat', sans-serif; font-weight: 700;
      cursor: pointer; letter-spacing: 0.04em; text-transform: uppercase; transition: all 0.2s;
    }
    .btn-del:hover { background: var(--danger); color: #fff; border-color: var(--danger); }
    .card-actions { display: flex; gap: 6px; }
    .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
    .empty-state .icon { font-size: 40px; margin-bottom: 12px; }
    .empty-state p { font-size: 13px; line-height: 1.6; }

    /* Modal de detalhes */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(14,26,56,0.5);
      display: none; align-items: center; justify-content: center; z-index: 1000;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--white); border-radius: 10px; padding: 32px;
      width: 100%; max-width: 480px; box-shadow: 0 8px 40px rgba(0,0,0,0.2);
    }
    .modal-title {
      font-family: 'Montserrat', sans-serif; font-size: 16px; font-weight: 800;
      color: var(--navy); text-transform: uppercase; letter-spacing: 0.04em;
      margin-bottom: 24px; display: flex; align-items: center; gap: 8px;
    }
    .modal-title::before {
      content: ''; display: inline-block; width: 4px; height: 18px;
      background: var(--sky); border-radius: 2px;
    }
    .detail-row {
      display: flex; gap: 12px; padding: 10px 0;
      border-bottom: 1px solid var(--border); align-items: baseline;
    }
    .detail-row:last-child { border-bottom: none; }
    .detail-key {
      font-family: 'Montserrat', sans-serif; font-size: 10px; font-weight: 700;
      letter-spacing: 0.08em; text-transform: uppercase; color: var(--blue); min-width: 110px;
    }
    .detail-val { font-size: 13px; color: var(--text); line-height: 1.5; }
    .modal-footer { margin-top: 24px; display: flex; justify-content: flex-end; }
    .btn-fechar {
      background: var(--off); color: var(--muted); border: 1px solid var(--border);
      font-family: 'Montserrat', sans-serif; font-size: 12px; font-weight: 700;
      letter-spacing: 0.04em; text-transform: uppercase; border-radius: 5px;
      padding: 9px 20px; cursor: pointer; transition: background 0.2s;
    }
    .btn-fechar:hover { background: var(--border); }

    .toast {
      position: fixed; bottom: 28px; right: 28px; background: var(--navy);
      color: #fff; border-radius: 8px; padding: 12px 20px; font-size: 13px;
      display: flex; align-items: center; gap: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.2);
      opacity: 0; transform: translateY(10px); transition: opacity 0.3s, transform 0.3s;
      pointer-events: none; max-width: 400px; z-index: 999;
    }
    .toast.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
    .toast.success .toast-icon { color: var(--success); }
    .toast.error   .toast-icon { color: var(--danger); }
    .toast-icon { font-size: 16px; font-weight: 800; }
    .perfil-badge {
      font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
      padding: 3px 8px; border-radius: 20px; font-family: 'Montserrat', sans-serif;
    }
    .perfil-admin       { background: #fff3e0; color: #e65100; }
    .perfil-gerenciador { background: #e8f0fc; color: #1a4fc4; }
    .perfil-visualizador{ background: #f0f0f0; color: #666; }
  </style>
</head>

<body>
  <div class="topbar"></div>
  <header>
    <span class="header-title">FDV — Reservas de Espaços</span>
    <div class="header-right">
      <span class="header-user" id="header-user"></span>
      <button class="btn-logout" onclick="logout()">Sair</button>
    </div>
  </header>
  <div class="nav-strip">
    <a href="reservas.html" class="active">Reservas</a>
    <a href="admin.html" id="nav-admin" style="display:none">Administração</a>
  </div>

  <div class="main-layout">
    <aside class="sidebar" id="sidebar-form">
      <div class="sidebar-heading">Nova Reserva</div>
      <div>
        <div class="section-label">Espaço</div>
        <div class="form-group">
          <label for="tipo">Tipo</label>
          <select id="tipo" onchange="updateRoomOptions()">
            <option value="sala">Sala de Aula</option>
            <option value="auditorio">Auditório</option>
            <option value="lab">Laboratório</option>
          </select>
        </div>
        <div class="form-group">
          <label for="sala">Sala / Espaço</label>
          <select id="sala"></select>
        </div>
      </div>
      <div>
        <div class="section-label">Data e Horário</div>
        <div class="form-group">
          <label for="data">Data</label>
          <input type="date" id="data">
        </div>
        <div class="time-grid">
          <div class="form-group">
            <label for="horario_inicio">Início</label>
            <select id="horario_inicio"></select>
          </div>
          <div class="form-group">
            <label for="horario_fim">Fim (opcional)</label>
            <select id="horario_fim"></select>
          </div>
        </div>
      </div>
      <div>
        <div class="section-label">Informações</div>
        <div class="form-group">
          <label id="label-favorecido">Responsável / Solicitante</label>
          <input type="text" id="favorecido" placeholder="Nome do responsável">
        </div>
        <div class="form-group" id="evento-group">
          <label id="label-evento">Curso / Evento</label>
          <input type="text" id="evento" placeholder="Nome do evento ou curso">
        </div>
        <div class="form-group" id="motivo-group" style="display:none">
          <label>Motivo</label>
          <input type="text" id="motivo" placeholder="Motivo de uso do lab">
        </div>
        <div class="form-group">
          <label>Observações</label>
          <textarea id="observacoes" placeholder="Informações adicionais..."></textarea>
        </div>
      </div>
      <button class="btn-primary" onclick="addReservation()">Confirmar Reserva</button>
    </aside>

    <aside class="sidebar" id="sidebar-viewer" style="display:none">
      <div class="sidebar-heading">Consulta</div>
      <p style="font-size:13px; color:var(--muted); line-height:1.6;">
        Seu perfil permite apenas a <strong>visualização</strong> das reservas.<br><br>
        Use os filtros ao lado para consultar os espaços disponíveis.
      </p>
    </aside>

    <main class="content-area">
      <div class="content-header">
        <div class="content-title">
          Reservas
          <span class="count-badge" id="count-label">0 reservas</span>
        </div>
      </div>

      <div class="filters">
        <div class="form-group">
          <label>Filtrar por Data</label>
          <input type="date" id="filter-date" oninput="renderList()">
        </div>
        <div class="form-group">
          <label>Tipo de Espaço</label>
          <select id="filter-tipo" onchange="renderList()">
            <option value="">Todos</option>
            <option value="sala">Sala</option>
            <option value="auditorio">Auditório</option>
            <option value="lab">Laboratório</option>
          </select>
        </div>
        <div class="form-group">
          <label>Buscar</label>
          <input type="text" id="filter-text" placeholder="Evento, sala, responsável..." oninput="renderList()">
        </div>
      </div>

      <div id="reservations-list">
        <div class="empty-state"><div class="icon">📋</div><p>Carregando reservas...</p></div>
      </div>
    </main>
  </div>

  <!-- Modal de Detalhes -->
  <div class="modal-overlay" id="modal-detalhes">
    <div class="modal">
      <div class="modal-title">Detalhes da Reserva</div>
      <div id="modal-detalhes-body"></div>
      <div class="modal-footer">
        <button class="btn-fechar" onclick="fecharDetalhes()">Fechar</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">
    <span class="toast-icon" id="toast-icon">✓</span>
    <span id="toast-msg"></span>
  </div>

  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script>
    const TABELA = 'reservas';
    let reservations = [];
    let perfilAtual  = null;
    let locaisMap    = {};

    const HORARIOS = [
      '7:30 - 8:20','8:20 - 9:10','9:10 - 9:30','9:30 - 10:20',
      '10:20 - 11:10','11:10 - 12:00','13:00','14:00','15:00',
      '16:00','17:00','18:00','19:00 - 19:50','19:50 - 20:40',
      '20:40 - 21:00','21:00 - 21:50','21:50 - 22:40'
    ];

    window.addEventListener('load', async () => {
      perfilAtual = await protegerPagina(['admin', 'gerenciador', 'visualizador']);
      if (!perfilAtual) return;

      document.getElementById('header-user').innerHTML =
        `${perfilAtual.nome} <span class="perfil-badge perfil-${perfilAtual.perfil}">${perfilAtual.perfil}</span>`;

      if (perfilAtual.perfil === 'admin')
        document.getElementById('nav-admin').style.display = 'flex';

      if (perfilAtual.perfil === 'visualizador') {
        document.getElementById('sidebar-form').style.display = 'none';
        document.getElementById('sidebar-viewer').style.display = 'flex';
      }

      document.getElementById('data').value = new Date().toISOString().split('T')[0];

      const hiSel = document.getElementById('horario_inicio');
      const hfSel = document.getElementById('horario_fim');
      HORARIOS.forEach(h => {
        hiSel.innerHTML += `<option value="${h}">${h}</option>`;
        hfSel.innerHTML += `<option value="${h}">${h}</option>`;
      });
      hfSel.innerHTML = '<option value="">Sem fim definido</option>' + hfSel.innerHTML;

      await loadLocais();
      await fetchReservations();

      // Fecha modal clicando fora
      document.getElementById('modal-detalhes').addEventListener('click', function(e) {
        if (e.target === this) fecharDetalhes();
      });
    });

    async function loadLocais() {
      const { data, error } = await db.from('locais').select('*').eq('ativo', true).order('tipo').order('nome');
      if (error || !data) return;
      locaisMap = {};
      data.forEach(l => {
        if (!locaisMap[l.tipo]) locaisMap[l.tipo] = [];
        locaisMap[l.tipo].push(l.nome);
      });
      updateRoomOptions();
    }

    function updateRoomOptions() {
      const tipo = document.getElementById('tipo').value;
      const sel  = document.getElementById('sala');
      sel.innerHTML = (locaisMap[tipo] || []).map(s => `<option value="${s}">${s}</option>`).join('');
      const motiGroup = document.getElementById('motivo-group');
      const labEl     = document.getElementById('label-evento');
      const favEl     = document.getElementById('label-favorecido');
      if (tipo === 'lab') {
        motiGroup.style.display = 'block'; labEl.textContent = 'Curso'; favEl.textContent = 'Responsável';
      } else if (tipo === 'auditorio') {
        motiGroup.style.display = 'none'; labEl.textContent = 'Descrição do Evento'; favEl.textContent = 'Favorecido';
      } else {
        motiGroup.style.display = 'none'; labEl.textContent = 'Curso / Evento'; favEl.textContent = 'Responsável / Solicitante';
      }
    }

    async function fetchReservations() {
      const { data, error } = await db.from(TABELA).select('*').order('data').order('horario_inicio');
      if (error) { showToast('Erro ao carregar reservas.', 'error'); return; }
      reservations = data || [];
      renderList();
    }

    async function saveToSupabase(r) {
      const { data, error } = await db.from(TABELA).insert([{
        tipo: r.tipo, sala: r.sala, data: r.data,
        horario_inicio: r.horario_inicio, horario_fim: r.horario_fim || null,
        horario: r.horario, favorecido: r.favorecido,
        evento: r.evento, motivo: r.motivo, observacoes: r.observacoes
      }]).select().single();
      if (error) throw error;
      return data;
    }

    async function deleteFromSupabase(id) {
      const { error } = await db.from(TABELA).delete().eq('id', id);
      if (error) throw error;
    }

    function getSlots(hi, hf) {
      if (!hf) return [hi];
      const iStart = HORARIOS.indexOf(hi), iEnd = HORARIOS.indexOf(hf);
      if (iStart === -1 || iEnd === -1 || iEnd < iStart) return [hi];
      return HORARIOS.slice(iStart, iEnd + 1);
    }

    function setFieldError(id, hasError) {
      const el = document.getElementById(id);
      if (!el) return;
      el.style.borderColor = hasError ? 'var(--danger)' : '';
      el.style.boxShadow   = hasError ? '0 0 0 3px rgba(217,58,58,0.15)' : '';
    }

    function clearFieldErrors() {
      ['data','sala','tipo','horario_inicio','favorecido','evento'].forEach(id => setFieldError(id, false));
    }

    async function addReservation() {
      if (perfilAtual?.perfil === 'visualizador') return;
      clearFieldErrors();
      const data = document.getElementById('data').value;
      const sala = document.getElementById('sala').value;
      const tipo = document.getElementById('tipo').value;
      const hi   = document.getElementById('horario_inicio').value;
      const hf   = document.getElementById('horario_fim').value;
      const fav  = document.getElementById('favorecido').value.trim();
      const ev   = document.getElementById('evento').value.trim();
      const mot  = document.getElementById('motivo').value.trim();
      const obs  = document.getElementById('observacoes').value.trim();

      if (!data) { setFieldError('data', true); showToast('Selecione uma data.', 'error'); return; }
      if (!ev && !fav) { setFieldError('favorecido', true); setFieldError('evento', true); showToast('Informe o responsável ou o evento.', 'error'); return; }

      const newSlots = getSlots(hi, hf);
      const conflict = reservations.find(r => {
        if (r.sala !== sala || r.data !== data) return false;
        return newSlots.some(s => getSlots(r.horario_inicio, r.horario_fim).includes(s));
      });

      if (conflict) {
        setFieldError('horario_inicio', true); setFieldError('sala', true);
        const d = new Date(data + 'T12:00:00').toLocaleDateString('pt-BR', { day: '2-digit', month: 'long' });
        showToast(`Conflito! "${conflict.sala}" já reservada em ${d} às ${conflict.horario_inicio} para "${conflict.evento || conflict.favorecido}".`, 'error', 6000);
        return;
      }

      const horario     = hf ? `${hi} até ${hf}` : hi;
      const novaReserva = { tipo, sala, data, horario_inicio: hi, horario_fim: hf, horario, favorecido: fav, evento: ev, motivo: mot, observacoes: obs };

      try {
        const salvo = await saveToSupabase(novaReserva);
        reservations.push(salvo);
        renderList();
        showToast('Reserva adicionada com sucesso!', 'success');
        ['evento','favorecido','motivo','observacoes'].forEach(id => document.getElementById(id).value = '');
        clearFieldErrors();
      } catch (err) {
        showToast('Erro ao salvar reserva.', 'error');
      }
    }

    async function deleteReservation(id) {
      if (perfilAtual?.perfil === 'visualizador') return;
      if (!confirm('Tem certeza que deseja remover esta reserva?')) return;
      try {
        await deleteFromSupabase(id);
        reservations = reservations.filter(r => String(r.id) !== String(id));
        renderList();
        showToast('Reserva removida com sucesso.', 'success');
      } catch (err) {
        showToast('Erro ao remover reserva.', 'error');
      }
    }

    function abrirDetalhes(id) {
      const r = reservations.find(r => String(r.id) === String(id));
      if (!r) return;

      const [ano, mes, dia] = r.data.split('-');
      const dataFmt = `${dia}/${mes}/${ano}`;
      const tipos   = { sala: 'Sala de Aula', auditorio: 'Auditório', lab: 'Laboratório' };

      const campos = [
        { label: 'Data',         val: dataFmt },
        { label: 'Horário',      val: r.horario },
        { label: 'Espaço',       val: r.sala },
        { label: 'Tipo',         val: tipos[r.tipo] || r.tipo },
        { label: 'Evento/Curso', val: r.evento  || '—' },
        { label: 'Responsável',  val: r.favorecido || '—' },
        r.motivo      ? { label: 'Motivo',       val: r.motivo }      : null,
        r.observacoes ? { label: 'Observações',  val: r.observacoes } : null,
      ].filter(Boolean);

      document.getElementById('modal-detalhes-body').innerHTML =
        campos.map(c => `
          <div class="detail-row">
            <span class="detail-key">${c.label}</span>
            <span class="detail-val">${c.val}</span>
          </div>`).join('');

      document.getElementById('modal-detalhes').classList.add('open');
    }

    function fecharDetalhes() {
      document.getElementById('modal-detalhes').classList.remove('open');
    }

    function renderList() {
      const fDate = document.getElementById('filter-date').value;
      const fTipo = document.getElementById('filter-tipo').value;
      const fText = document.getElementById('filter-text').value.toLowerCase();

      let list = [...reservations];
      if (fDate) list = list.filter(r => r.data === fDate);
      if (fTipo) list = list.filter(r => r.tipo === fTipo);
      if (fText) list = list.filter(r =>
        (r.evento||'').toLowerCase().includes(fText) ||
        (r.sala||'').toLowerCase().includes(fText) ||
        (r.favorecido||'').toLowerCase().includes(fText)
      );
      list.sort((a, b) => a.data.localeCompare(b.data) || a.horario_inicio.localeCompare(b.horario_inicio));

      const container   = document.getElementById('reservations-list');
      const podeExcluir = perfilAtual?.perfil === 'admin';

      document.getElementById('count-label').textContent =
        `${reservations.length} reserva${reservations.length !== 1 ? 's' : ''}`;

      if (list.length === 0) {
        container.innerHTML = `<div class="empty-state"><div class="icon">📋</div><p>${reservations.length > 0 ? 'Nenhuma reserva corresponde ao filtro.' : 'Nenhuma reserva cadastrada ainda.'}</p></div>`;
        return;
      }

      container.innerHTML = `
        <div class="reservations-wrap">
          <table class="res-table">
            <thead>
              <tr>
                <th>Data</th>
                <th>Horário</th>
                <th>Espaço</th>
                <th>Tipo</th>
                <th>Evento / Curso</th>
                <th>Responsável</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              ${list.map(r => {
                const [ano, mes, dia] = r.data.split('-');
                const dataFmt = `${dia}/${mes}/${ano}`;
                const typeLbl = r.tipo === 'sala' ? 'Sala' : r.tipo === 'auditorio' ? 'Auditório' : 'Lab';
                return `<tr>
                  <td style="white-space:nowrap;font-weight:600">${dataFmt}</td>
                  <td><span class="time-badge">⏱ ${r.horario}</span></td>
                  <td style="font-weight:600">${r.sala}</td>
                  <td><span class="type-badge type-${r.tipo}">${typeLbl}</span></td>
                  <td>${r.evento || '—'}</td>
                  <td style="color:var(--muted)">${r.favorecido || '—'}</td>
                  <td>
                    <div class="card-actions">
                      <button class="btn-details" onclick="abrirDetalhes(${r.id})">Detalhes</button>
                      ${podeExcluir ? `<button class="btn-del" onclick="deleteReservation(${r.id})">Remover</button>` : ''}
                    </div>
                  </td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>`;
    }

    let _toastTimer = null;
    function showToast(msg, type = 'success', duration = 3500) {
      const t = document.getElementById('toast');
      if (_toastTimer) clearTimeout(_toastTimer);
      t.className = `toast show ${type}`;
      document.getElementById('toast-icon').textContent = type === 'success' ? '✓' : '✕';
      document.getElementById('toast-msg').textContent  = msg;
      _toastTimer = setTimeout(() => { t.className = 'toast'; }, duration);
    }
  </script>
</body>
</html>
